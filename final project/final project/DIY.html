<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your own art</title>
    <link rel="stylesheet" href="DIY.css">
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="DIY.js" defer></script>
</head>
<body>

    <!-- environment -->

    <div id="scene">

        <img id="background" src="images/wallpaper.webp">

        <img id="floor" src="images/floor.png">

        <img id="light" src="images/light1.png">

        <!-- scene objects -->

<img id="pillar" src="images/pillar.png">

<img id="pillar2" src="images/pillar2.png">

<img id="easel" src="images/easel.png">

<img id="easel2" src="images/easel 2.png">

<img id="table" src="images/table.png">

<!-- darkness overlay -->

<div id="darkness"></div>

        <!-- hover text -->

        <p id="hover-text"></p>

        <!-- opening dialogue -->

        <div id="introduction">

            <h1 id="welcome">Welcome to the Craft Area!</h1>

            <h2>Choose your medium!</h2>

        </div>

</body>
</html>
